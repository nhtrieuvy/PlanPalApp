[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:web]
command=daphne -b 0.0.0.0 -p 8000 planpalapp.asgi:application
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startsecs=10
priority=10

[program:worker]
; One worker process keeps the single 512 MB machine within a small budget.
command=python -m celery -A planpalapp worker -l info -Q high_priority,default,plan_status,low_priority --concurrency=1
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startsecs=10
priority=20

[program:beat]
; Keep one machine only: another Beat would execute periodic jobs twice.
command=python -m celery -A planpalapp beat -l info --pidfile=/tmp/celerybeat.pid
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
startsecs=10
priority=30
