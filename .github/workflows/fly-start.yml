name: Start PlanPal App (Morning)

on:
  schedule:
    # Chạy lúc 23:30 UTC = 06:30 ICT (UTC+7)
    - cron: '30 23 * * *'
  
  # Cho phép chạy thủ công từ Actions tab
  workflow_dispatch:

jobs:
  start-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Start PlanPal Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Starting the single PlanPal application machine..."
          flyctl scale count 1 -a planpal-backend --yes
          echo "✅ App started successfully at $(date)"
          
      - name: Wait for app to be healthy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Waiting for app to become healthy..."
          sleep 30
          curl --fail --retry 5 --retry-delay 5 https://planpal-backend.fly.dev/health/ready
          flyctl status -a planpal-backend
