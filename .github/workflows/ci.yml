name: PlanPal CI

on:
  push:
    branches: [main, devbranch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: planpal_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: planpalapp
    env:
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key
      DB_NAME: planpal_ci
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REQUIRE_EXTERNAL_REDIS: "false"
      PLANPAL_USE_LOCAL_REDIS_DEFAULTS: "false"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: planpalapp/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
        working-directory: .
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        run: python manage.py test --noinput

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planpal_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Web release build
        run: >-
          flutter build web --release
          --dart-define=APP_ENV=production
          --dart-define=GOONG_MAPTILES_KEY=ci-public-placeholder
          --dart-define=FIREBASE_WEB_VAPID_KEY=ci-public-placeholder
