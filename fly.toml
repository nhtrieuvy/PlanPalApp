app = "planpal-backend"
primary_region = "sin"

[build]

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "planpalapp.settings"
  ENABLE_API_DOCS = "true"
  API_DOCS_REQUIRE_AUTH = "false"
  PLANPAL_USE_LOCAL_REDIS_DEFAULTS = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512
