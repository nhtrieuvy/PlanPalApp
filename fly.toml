app = "planpal-backend"
primary_region = "sin"

[build]

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  PORT = "8000"
  PLANPAL_ENV = "production"
  DJANGO_SETTINGS_MODULE = "planpalapp.settings"
  ALLOWED_HOSTS = "planpal-backend.fly.dev"
  CORS_ALLOW_ALL_ORIGINS = "false"
  CORS_ALLOWED_ORIGINS = "https://planpal.app,https://planpal-web.planpal-app.workers.dev"
  FRONTEND_ORIGIN = "https://planpal.app"
  CSRF_TRUSTED_ORIGINS = "https://planpal-backend.fly.dev,https://planpal.app,https://planpal-web.planpal-app.workers.dev"
  WEBSOCKET_TICKET_TTL_SECONDS = "45"
  ENABLE_API_DOCS = "true"
  API_DOCS_REQUIRE_AUTH = "false"
  REQUIRE_EXTERNAL_REDIS = "true"
  USE_REDIS_CACHE = "true"
  USE_REDIS_CHANNELS = "true"
  LOG_LEVEL = "INFO"
  LOG_TO_FILE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"
    [http_service.checks.headers]
      Host = "planpal-backend.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512
